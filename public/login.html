<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Sign — Sign in</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">

    <div id="setupView" class="hidden">
      <h1>Set up your platform admin account</h1>
      <p class="sub">One-time step for the person running this service — not a client organization. You'll get full visibility and control over every client org.</p>
      <label>Your email</label><input type="email" id="setupEmail">
      <label>Password</label><input type="password" id="setupPassword">
      <button class="primary" id="setupBtn" style="width:100%">Create platform admin account</button>
      <p class="err" id="setupErr"></p>
    </div>

    <div id="authView" class="hidden">
      <h1>E-Sign</h1>
      <div class="auth-tabs">
        <button id="tabLogin" class="active">Log in</button>
        <button id="tabSignup">Register organization</button>
      </div>

      <div id="loginPane">
        <label>Email</label><input type="email" id="loginEmail">
        <label>Password</label><input type="password" id="loginPassword">
        <button class="primary" id="loginBtn" style="width:100%">Log in</button>
        <p class="err" id="loginErr"></p>
      </div>

      <div id="signupPane" class="hidden">
        <p class="sub" style="margin-top:0">For client companies only.</p>
        <label>Company name</label><input type="text" id="suOrgName">
        <label>Your email</label><input type="email" id="suEmail">
        <label>Password</label><input type="password" id="suPassword">
        <button class="primary" id="signupBtn" style="width:100%">Create organization</button>
        <p class="err" id="signupErr"></p>
      </div>
    </div>

  </div>
</div>
<script src="js/api.js"></script>
<script src="login.js"></script>
</body>
</html>
