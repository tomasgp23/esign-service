<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accept invite</title>
<style>
  body { font-family: Arial, sans-serif; background:#f4f5f7; color:#0b1626; display:flex; align-items:center;
    justify-content:center; height:100vh; margin:0; }
  .card { background:#fff; border-radius:8px; padding:24px; width:320px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  input { width:100%; box-sizing:border-box; padding:9px; border:1px solid #ccc; border-radius:6px; margin:6px 0 14px; }
  button { background:#c9a84c; border:none; border-radius:6px; padding:10px 18px; font-weight:bold; cursor:pointer; width:100%; }
  .err { color:#a01818; font-size:13px; }
</style>
</head>
<body>
<div class="card">
  <h2>Set your password</h2>
  <input type="password" id="password" placeholder="Choose a password">
  <button id="acceptBtn">Accept invite</button>
  <p class="err" id="err"></p>
</div>
<script>
  const token = (location.hash.match(/[#&]t=([^&]+)/) || [])[1] || '';
  document.getElementById('acceptBtn').addEventListener('click', async () => {
    const errEl = document.getElementById('err');
    errEl.textContent = '';
    const password = document.getElementById('password').value;
    const res = await fetch('/api/auth/accept-invite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password }),
    });
    if (res.ok) {
      location.href = '/admin.html';
    } else {
      const data = await res.json().catch(() => ({}));
      errEl.textContent =
        data.error === 'invite_expired' ? 'This invite has expired.' :
        data.error === 'invite_already_used' ? 'This invite was already used.' :
        'Could not accept invite.';
    }
  });
</script>
</body>
</html>
